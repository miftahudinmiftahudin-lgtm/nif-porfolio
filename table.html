<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Tabel Grid</title>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 900px;
      margin: 20px auto;
      border: 3px solid #3129ca;
    }
    td {
      border: 1px solid #ff0000;
      padding: 15px;
      text-align: left;
      vertical-align: top;
      font-family: Arial, sans-serif;
      font-size: 14px;
      background-color: #fff;
    }
  </style>
</head>
<body>
  <table>
    <tr>
      <td colspan="3">1</td>
      <td rowspan="3">2</td>
      <td colspan="2">3</td>
      <td rowspan="2">N</td>
    </tr>
    <tr>
      <td>4</td>
      <td>5</td>
      <td>6</td>
      <td>7</td>
      <td>8</td>
    </tr>
    <tr>
      <td colspan="3">9</td>
      <td colspan="2">10</td>
      <td>x</td>
    </tr>
    <tr>
      <td colspan="7">x</td>
    </tr>
    <tr>
      <td>x</td>
      <td>x</td>
      <td>x</td>
      <td>x</td>
      <td>x</td>
      <td>x</td>
      <td>x</td>
    </tr>
  </table>

</body>
</html>
